# Render Blueprint for the Mambe Fundraiser Manager.
#
# Two separate copies:
#   staging    – deploys from the "main" branch, connected to the dev store
#   production – deploys from the "production" branch, connected to mambeblankets.com
# Each has its own web service, Postgres database and cron job. Both deploy
# only after the GitHub "Tests" check passes.
#
# The cron job runs every 15 minutes and calls the web service's /jobs/clock
# endpoint with a shared secret. That runs the status clock every time, and
# the nightly re-check during the 3 AM Pacific hour.
#
# Plan names: Render now names plans by size. "0.5c-512mb" is the former
# Starter web plan; "0.1c-256mb" is the former Basic-256mb Postgres plan.

services:
  # ---------------------------------------------------------------- staging
  - type: web
    name: mambe-fundraisers-staging
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mambe-fundraisers-staging-db
          property: connectionString
      - key: SCOPES
        value: read_orders,read_all_orders,read_products,read_inventory,write_products,write_online_store_navigation
      # From the staging app in the Shopify Dev Dashboard (Client ID / Client secret).
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # The dev store only has test-gateway orders, so staging counts them.
      # Production leaves this unset: Shopify test orders never count there.
      - key: COUNT_TEST_ORDERS
        value: "true"
      # Shared with the cron job, which sends it to /jobs/clock.
      - key: CRON_SECRET
        generateValue: true
      # Sentry project key (DSN). Failures are emailed by Sentry.
      - key: SENTRY_DSN
        sync: false
      # Klaviyo (session 4). The test recipient receives every staging email
      # instead of the organizer.
      - key: KLAVIYO_API_KEY
        sync: false
      - key: KLAVIYO_ORGANIZER_LIST_ID
        sync: false
      - key: KLAVIYO_TEST_RECIPIENT
        sync: false
      - key: PORTAL_HELP_EMAIL
        sync: false

  - type: cron
    name: mambe-fundraisers-staging-cron
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: echo "nothing to build"
    startCommand: >-
      curl -fsS -m 900 -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      https://mambe-fundraisers-staging.onrender.com/jobs/clock
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: mambe-fundraisers-staging
          envVarKey: CRON_SECRET

  # ------------------------------------------------------------- production
  - type: web
    name: mambe-fundraisers
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: production
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mambe-fundraisers-db
          property: connectionString
      - key: SCOPES
        value: read_orders,read_all_orders,read_products,read_inventory,write_products,write_online_store_navigation
      # From the production app in the Shopify Dev Dashboard.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: KLAVIYO_API_KEY
        sync: false
      - key: KLAVIYO_ORGANIZER_LIST_ID
        sync: false
      - key: PORTAL_HELP_EMAIL
        sync: false
      # Organizer portal and emails use the custom domain.
      - key: PORTAL_HOST
        value: fundraise.mambeblankets.com
      - key: STOREFRONT_URL
        value: https://mambeblankets.com

  - type: cron
    name: mambe-fundraisers-cron
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: production
    schedule: "*/15 * * * *"
    buildCommand: echo "nothing to build"
    startCommand: >-
      curl -fsS -m 900 -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      https://mambe-fundraisers.onrender.com/jobs/clock
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: mambe-fundraisers
          envVarKey: CRON_SECRET

databases:
  - name: mambe-fundraisers-staging-db
    databaseName: mambe_fundraisers_staging
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: [] # only Render services can connect

  - name: mambe-fundraisers-db
    databaseName: mambe_fundraisers
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: [] # only Render services can connect
