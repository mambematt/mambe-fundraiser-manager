# Runs on every push. Render deploys only after this passes.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Starts a throwaway Postgres 17 and applies the real migrations.
      - name: Tests (including the spec's attribution cases)
        run: npm test

      - name: Build
        run: npm run build
