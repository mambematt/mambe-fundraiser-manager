# Base Shopify app configuration. The staging (dev store) and production apps
# each get their own linked copy: shopify.app.staging.toml and
# shopify.app.production.toml. Keep scopes and webhooks identical in all three.
client_id = ""
name = "Mambe Fundraisers"
application_url = "https://example.com"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders,read_all_orders,read_products,read_inventory,write_products,write_online_store_navigation"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[webhooks]
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.shopify.tsx
  [[webhooks.subscriptions]]
  topics = [
    "orders/create",
    "orders/updated",
    "orders/paid",
    "orders/cancelled",
    "refunds/create",
    "products/update",
    "products/delete",
  ]
  uri = "/webhooks/shopify"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[pos]
embedded = false
